services:
  - type: web
    name: aviator-backend-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: aviator-backend-db
          property: connectionString
      - key: DATABASE_CONN_MAX_AGE
        value: "0"
      - key: AVIATOR_RUN_MONITOR_IN_WEB
        value: "True"
      - key: AVIATOR_AUTO_START_MONITOR
        value: "True"
      - key: GUNICORN_WORKERS
        value: "1"

databases:
  - name: aviator-backend-db
    plan: free
